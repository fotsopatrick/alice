# Options Odoo — les secrets (mots de passe) arrivent par ENV, jamais ici.
[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
admin_passwd = change-me        # remplacé en ligne de commande si ODOO_ADMIN_PASSWD
list_db = False                 # Cloud Run / ACI : ne jamais exposer la liste des bases
db_maxconn = 20
# db_host / db_user / db_password sont injectés par l'entrypoint via HOST/USER/PASSWORD