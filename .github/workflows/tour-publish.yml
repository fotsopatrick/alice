# Relais de publication : construit l'image de la TOUR COMMUNITY et la publie
# sur ghcr.io/fotsopatrick/tour-community:latest, sans dépendre de Docker Hub
# ni de jetons à portée poussée sur le dépôt tour-community.
name: tour-publish

on:
  push:
    branches: [main]
    paths:
      - 'cloud/tour/**'
      - '.github/workflows/tour-publish.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/fotsopatrick/tour-community

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./cloud/tour
          file: cloud/tour/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha, mode=max